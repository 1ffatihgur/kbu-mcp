[project]
name = "kbu-mcp"
version = "2.0.0"
description = "Karabük Üniversitesi için hibrit arama motoru + MCP sunucusu: tüm *.karabuk.edu.tr siteleri, PDF/Office belgeleri (OCR), UNIS akademisyen profilleri, KBÜ Medya, telefon rehberi"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "1ffatihgur" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "claude", "codex", "karabuk", "universite", "kbu"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Natural Language :: Turkish",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp[cli]>=2.3,<3",
    "httpx>=0.28",
    "selectolax>=1.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "snowballstemmer>=2.2",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/1ffatihgur/kbu-mcp"
Issues = "https://github.com/1ffatihgur/kbu-mcp/issues"
Changelog = "https://github.com/1ffatihgur/kbu-mcp/blob/main/CHANGELOG.md"

[project.scripts]
kbu-mcp = "kbu_mcp.server:main"
kbu = "kbu_mcp.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
